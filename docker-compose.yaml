services:
  phoenix-admin-api:
    image: <DOCKER_IMAGE>
    container_name: phoenix-admin-api

    environment:
      - TZ=<TIMEZONE>

      - GUNICORN_ARG_WORKERS=<WORKERS>
      - GUNICORN_ARG_THREADS=<THREADS>
      - GUNICORN_ARG_TIMEOUT=<TIMEOUT_SECONDS>
      - GUNICORN_ARG_BIND_PORT=<APP_PORT>

      # PostgreSQL
      - POSTGRES_DB_URI=<POSTGRES_DB_URI>
      - POSTGRES_POOL_SIZE=<POSTGRES_POOL_SIZE>

      # Memcached
      - MEMCACHED_DB_HOST=<MEMCACHED_HOST>
      - MEMCACHED_DB_PORT=<MEMCACHED_PORT>
      - MEMCACHED_DB_POOL_SIZE=<MEMCACHED_POOL_SIZE>
      - MAX_AGE_OF_CACHE=<CACHE_TTL_SECONDS>

      # RabbitMQ
      - RABBITMQ_HOST=<RABBITMQ_HOST>
      - RABBITMQ_PORT=<RABBITMQ_PORT>
      - RABBITMQ_VIRTUAL_HOST=<RABBITMQ_VHOST>
      - RABBITMQ_USERNAME=<RABBITMQ_USERNAME>
      - RABBITMQ_PASSWORD=<RABBITMQ_PASSWORD>
      - RABBITMQ_EXCHANGE=<RABBITMQ_EXCHANGE>
      - RABBITMQ_AUDIT_LOGS_QUEUE=<AUDIT_QUEUE>
      - RABBITMQ_NOTIFICATIONS_QUEUE=<NOTIFICATIONS_QUEUE>
      - RABBITMQ_MAILBOX_MANAGER_QUEUE=<MAILBOX_MANAGER_QUEUE>

      # S3
      - S3_BUCKET_NAME=<S3_BUCKET_NAME>
      - S3_ACCESS_KEY=<S3_ACCESS_KEY>
      - S3_SECRET_KEY=<S3_SECRET_KEY>
      - S3_ENDPOINT=<S3_ENDPOINT>

      # ClickHouse
      - CLICK_HOUSE_HOST=<CLICKHOUSE_HOST>
      - CLICK_HOUSE_PORT=<CLICKHOUSE_PORT>
      - CLICK_HOUSE_USERNAME=<CLICKHOUSE_USERNAME>
      - CLICK_HOUSE_PASSWORD=<CLICKHOUSE_PASSWORD>
      - CLICK_HOUSE_AUDIT_LOGS_TABLE=<AUDIT_LOGS_TABLE>
      - CLICK_HOUSE_MAIL_FLOW_LOGS_TABLE=<MAIL_FLOW_LOGS_TABLE>

      # QuestDB
      - QUEST_DB_HOST=<QUESTDB_HOST>
      - QUEST_DB_PORT=<QUESTDB_PORT>
      - QUEST_DB_USER=<QUESTDB_USER>
      - QUEST_DB_PASSWORD=<QUESTDB_PASSWORD>

      # Centrifugo
      - CENTRIFUGO_API_URL=<CENTRIFUGO_API_URL>
      - CENTRIFUGO_SECRET_KEY=<CENTRIFUGO_SECRET_KEY>
      - CENTRIFUGO_ALGORITHM=<CENTRIFUGO_ALGORITHM>

      # OpenTelemetry
      - OTEL_HEALTH_URL=<OTEL_HEALTH_URL>
      - OTEL_EXPORTER_OTLP_ENDPOINT=<OTEL_EXPORTER_OTLP_ENDPOINT>
      - OTEL_EXPORTER_OTLP_HEADERS=<OTEL_EXPORTER_OTLP_HEADERS>
      - OTEL_EXPORTER_OTLP_PROTOCOL=<OTEL_PROTOCOL>
      - OTEL_SERVICE_NAME=<OTEL_SERVICE_NAME>
      - OTEL_TRACES_EXPORTER=<OTEL_TRACES_EXPORTER>
      - OTEL_METRICS_EXPORTER=<OTEL_METRICS_EXPORTER>
      - OTEL_LOGS_EXPORTER=<OTEL_LOGS_EXPORTER>

      # Server Manager
      - SERVER_MANAGER_API_MAPS=<SERVER_MANAGER_MAPS>
      - SERVER_MANAGER_API_KEY=<SERVER_MANAGER_API_KEY>

      # DKIM
      - DKIM_API_URL=<DKIM_API_URL>
      - DKIM_API_AUTH_TOKEN=<DKIM_API_AUTH_TOKEN>

      # AI
      - AI_API_URL=<AI_API_URL>
      - AI_API_KEY=<AI_API_KEY>
      - OPENAI_API_KEY=<OPENAI_API_KEY>
      - DEEP_INFRA_API_KEY=<DEEP_INFRA_API_KEY>
      - DEEP_INFRA_API_URL=<DEEP_INFRA_API_URL>

      # SSO
      - SSO_API_BASE_URL=<SSO_API_BASE_URL>
      - SSO_API_KEY=<SSO_API_KEY>

      # Google reCAPTCHA
      - GOOGLE_RECAPTCHA_PROJECT_ID=<GOOGLE_RECAPTCHA_PROJECT_ID>
      - GOOGLE_RECAPTCHA_API_KEY=<GOOGLE_RECAPTCHA_API_KEY>
      - GOOGLE_RECAPTCHA_SITE_KEY=<GOOGLE_RECAPTCHA_SITE_KEY>

      # Password Leak Detection
      - GOOGLE_RECAPTCHA_PLD_URL=<GOOGLE_RECAPTCHA_PLD_URL>
      - GOOGLE_RECAPTCHA_PLD_API_KEY=<GOOGLE_RECAPTCHA_PLD_API_KEY>

      # DNS Lookup
      - DNS_LOOKUP_API_URL=<DNS_LOOKUP_API_URL>
      - DNS_LOOKUP_API_KEY=<DNS_LOOKUP_API_KEY>

      # General
      - LOG_LEVEL=<LOG_LEVEL>
      - INTERNAL_API_KEY=<INTERNAL_API_KEY>
      - COOKIE_DOMAIN=<COOKIE_DOMAIN>
      - ALLOWED_ORIGINS=<ALLOWED_ORIGINS>

      # IMAP
      - IMAP_ADMIN_PASSWORD=<IMAP_ADMIN_PASSWORD>
      - IMAP_HOST_NAME=<IMAP_HOST_NAME>

      # Mail
      - MX_SERVER_DOMAIN=<MX_SERVER_DOMAIN>
      - DEFAULT_SERVER_ID=<DEFAULT_SERVER_ID>

    ports:
      - "127.0.0.1:<HOST_PORT>:<APP_PORT>"

    volumes:
      - <HOST_LOG_DIRECTORY>:/var/log/api

    networks:
      - phoenix-admin-network

    restart: always

  cache-db:
    image: memcached:1.6
    container_name: cache-db
    restart: always

    networks:
      - phoenix-admin-network

networks:
  phoenix-admin-network:
    driver: bridge